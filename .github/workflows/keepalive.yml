name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: 'curl -s -f "$URL/rest/v1/posts?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"'
